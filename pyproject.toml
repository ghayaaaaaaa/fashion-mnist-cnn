[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-mnist-cnn"
version = "0.1.0"
description = "A configurable Keras CNN benchmark for Fashion-MNIST."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26,<2.2",
    "tensorflow>=2.21,<3.0",
]

[project.scripts]
fashion-mnist-train = "fashion_mnist_cnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
